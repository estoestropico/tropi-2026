</style></head> <body data-astro-cid-i3xax3ax> <div class="wrap" data-astro-cid-i3xax3ax> <div class="svc-list" data-list data-astro-cid-i3xax3ax> <p class="eyebrow" data-astro-cid-i3xax3ax>Disciplinas · pasá el mouse por cada una</p> <a class="svc-line" data-i="0" data-astro-cid-i3xax3ax><span class="num" data-astro-cid-i3xax3ax>01</span><span class="nm" data-astro-cid-i3xax3ax>Branding</span></a> <a class="svc-line" data-i="1" data-astro-cid-i3xax3ax><span class="num" data-astro-cid-i3xax3ax>02</span><span class="nm" data-astro-cid-i3xax3ax>Web</span></a> <a class="svc-line" data-i="2" data-astro-cid-i3xax3ax><span class="num" data-astro-cid-i3xax3ax>03</span><span class="nm" data-astro-cid-i3xax3ax>Ads</span></a> <a class="svc-line" data-i="3" data-astro-cid-i3xax3ax><span class="num" data-astro-cid-i3xax3ax>04</span><span class="nm" data-astro-cid-i3xax3ax>Social</span></a> <a class="svc-line" data-i="4" data-astro-cid-i3xax3ax><span class="num" data-astro-cid-i3xax3ax>05</span><span class="nm" data-astro-cid-i3xax3ax>Automatización</span></a> </div> </div> <!-- panel único que sigue el cursor --> <div class="svc-panel" data-panel data-astro-cid-i3xax3ax> <div class="svc-clip" data-astro-cid-i3xax3ax> <div class="svc-flap" data-flap style="--c:#b4e600" data-astro-cid-i3xax3ax><span class="lbl" data-astro-cid-i3xax3ax>Branding</span></div> <div class="svc-flap" data-flap style="--c:#0077ff" data-astro-cid-i3xax3ax><span class="lbl" data-astro-cid-i3xax3ax>Web</span></div> <div class="svc-flap" data-flap style="--c:#ff0059" data-astro-cid-i3xax3ax><span class="lbl" data-astro-cid-i3xax3ax>Ads</span></div> <div class="svc-flap" data-flap style="--c:#5d00ff" data-astro-cid-i3xax3ax><span class="lbl" data-astro-cid-i3xax3ax>Social</span></div> <div class="svc-flap" data-flap style="--c:#0fffdb" data-astro-cid-i3xax3ax><span class="lbl" data-astro-cid-i3xax3ax>Automatización</span></div> </div> </div> <div class="hint" data-astro-cid-i3xax3ax>lab · servicios</div> <script>
    (function () {
      const list = document.querySelector('[data-list]');
      const panel = document.querySelector('[data-panel]');
      const lines = [...document.querySelectorAll('.svc-line')];
      const flaps = [...document.querySelectorAll('.svc-flap')];
      if (!panel || !lines.length) return;

      // ---- El panel sigue el cursor (con inercia, como el blob) ----
      const OFF_X = 28, OFF_Y = 24;           // corrimiento respecto del cursor
      let tx = 0, ty = 0, px = 0, py = 0, raf = 0;
      const tick = () => {
        px += (tx - px) * 0.16; py += (ty - py) * 0.16;
        // centrar verticalmente el panel en el cursor, correrlo a la derecha
        panel.style.transform = `translate(${(px + OFF_X).toFixed(1)}px, ${(py - panel.offsetHeight / 2 + OFF_Y).toFixed(1)}px)`;
        raf = requestAnimationFrame(tick);
      };
      addEventListener('mousemove', (e) => { tx = e.clientX; ty = e.clientY; if (!raf) tick(); }, { passive: true });

      // ---- Solapas: al entrar al servicio j suben las capas 0..j (la j arriba);
      // al pasar a un servicio menor, las de índice mayor RETROCEDEN (bajan). ----
      flaps.forEach((f, i) => { f.style.zIndex = i; });        // orden fijo: mayor índice, más arriba
      const setActive = (j) => {
        panel.classList.add('on');
        flaps.forEach((f, i) => f.classList.toggle('up', i <= j));
      };
      lines.forEach((ln, j) => ln.addEventListener('mouseenter', () => setActive(j)));
      list.addEventListener('mouseleave', () => {
        panel.classList.remove('on');
        flaps.forEach(f => f.classList.remove('up'));
      });
    })();
  </script> </body> </html>
